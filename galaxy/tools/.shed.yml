name: spice_lineage
description: Single-cell Plasticity Inference and Clonal Evolution
long_description: >-
  Five SPICE tools for standard-input filtering, supported-tree clone discovery,
  ancestral-state inference, plasticity, and clone-level BH summaries. Clone
  collections compose with the pinned IUC IQ-TREE 2.4.0 tool. Current software
  version: 0.2.0. Local Conda testing is required until Bioconda publication.
  BayesTraits is an external administrator-provided dependency.
categories:
