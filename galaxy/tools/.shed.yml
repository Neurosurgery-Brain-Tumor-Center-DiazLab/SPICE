name: spice_lineage
owner: diazlab
description: Single-cell Plasticity Inference and Clonal Evolution
long_description: >-
  Five SPICE tools for standard-input filtering, supported-tree clone discovery,
  ancestral-state inference, plasticity, and clone-level BH summaries. Clone
  collections compose with the pinned IUC IQ-TREE 2.4.0 tool. SPICE software
  version 0.2.0 is released and these Galaxy wrappers are prepared for Tool Shed
  publication; public Tool Shed deployment is still pending. The Galaxy Conda
  requirement spice-lineage=0.2.0 is publicly available from Bioconda after
  PR #69381 merged; a fresh Linux installation was verified on 2026-10-19.
  Tool Shed publication and public BioContainer verification remain pending.
  BayesTraits V4.1.3 remains external and administrator-provided; it is not
  redistributed.
categories:
  - Phylogenetics
homepage_url: https://github.com/Neurosurgery-Brain-Tumor-Center-DiazLab/SPICE
remote_repository_url: https://github.com/Neurosurgery-Brain-Tumor-Center-DiazLab/SPICE/tree/main/galaxy/tools
